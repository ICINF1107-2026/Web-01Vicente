<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Trabajos - Vicente Palacio</title>
</head>
<body>
  <header class="site-header">
    <nav aria-label="Navegación principal">
      <a class="logo" href="index.html">PORTAFOLIO</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="trabajos.html" aria-current="page">Proyectos</a></li>
        <li><a href="index.html#about">Sobre mí</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="works-page">
    <section class="works-hero" aria-labelledby="works-page-title">
      <div class="top-back-wrap top-back-wrap-hero">
        <a class="back-button" href="index.html" aria-label="Volver a la página principal">←</a>
      </div>
      <h1 id="works-page-title">Trabajos</h1>
      <p>Explora una selección de proyectos organizados por tipo de trabajo, desde identidad visual hasta experiencias digitales y piezas experimentales.</p>
    </section>

    <section class="category-grid" aria-label="Categorías de trabajos">
      <a class="category-card" href="#proyectos-estudiantiles">Proyectos estudiantiles</a>
    </section>

    <section class="works-sections" aria-label="Contenido de trabajos">
      <section class="works-section" id="proyectos-estudiantiles" aria-labelledby="student-projects-title">
        <h2 id="student-projects-title">Proyectos estudiantiles</h2>
        <div class="mini-grid mini-grid-compact">
          <a class="mini-card mini-card-link" href="index.html" aria-label="Volver al inicio desde el proyecto estudiantil">
            <span>Proyecto</span>
            <h3>ICINF</h3>
          </a>
        </div>
      </section>

      <section class="works-section safe-box-section" aria-labelledby="safe-box-title">
        <div class="safe-box-wrap">
          <h2 id="safe-box-title">Caja fuerte</h2>
          <button class="safe-box" type="button" aria-label="Estado: caja fuerte bloqueada" data-clicks="0">
            <span>Estado</span>
            <strong>LOCK</strong>
          </button>
        </div>
      </section>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
